# ============================================================
# 心屿 XinYu · Docker Compose 一键部署 (架构重构版)
#
# 启动: docker compose up -d      访问: http://localhost
# 敏感配置在同目录 .env (不入库), 模板见 .env.example
#
# 拓扑:
#   浏览器 -> nginx(80) -> 静态资源 / -> backend(9000) -> mysql(3306)
#                                              └──────> ai-service(9100) -> qdrant(6333)
# backend/ai-service/mysql/qdrant 只在 compose 内网暴露, 唯一对外入口是 nginx
# ============================================================

services:

  mysql:
    image: mysql:8.0
    container_name: xinyu-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: xinyu
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - xinyu-mysql-data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: xinyu-qdrant
    environment:
      TZ: Asia/Shanghai
    volumes:
      - xinyu-qdrant-data:/qdrant/storage
    expose:
      - "6333"   # REST API (Python SDK 走此端口)
      - "6334"   # gRPC API
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:6333/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Python AI 服务: LLM / RAG / Embedding / Memory / Prompt 编排
  ai-service:
    build: ./xinyu-ai
    container_name: xinyu-ai
    environment:
      AI_HOST: "0.0.0.0"
      AI_PORT: "9100"
      # Python 用 REST 端口 6333 (不是 Java 的 gRPC 6334)
      XINYU_QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: xinyu_kb
      EMBEDDING_DIM: "1536"
      EMBEDDING_MODEL: text-embedding-v2
      TZ: Asia/Shanghai
    depends_on:
      qdrant:
        condition: service_healthy
    expose:
      - "9100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9100/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build: ./xinyu-server
    container_name: xinyu-server
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/xinyu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      XINYU_JWT_SECRET: ${XINYU_JWT_SECRET}
      # Python AI 服务地址 (compose 内网服务名)
      XINYU_AI_SERVICE_BASE_URL: http://ai-service:9100
      # Qdrant 地址 (保留, 供遗留的 Java Qdrant 配置使用; 后续清理后可移除)
      XINYU_QDRANT_URL: http://qdrant:6334
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    expose:
      - "9000"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  nginx:
    build: ./xinyu-web
    container_name: xinyu-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  xinyu-mysql-data:
  xinyu-qdrant-data:
