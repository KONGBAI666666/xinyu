# ============================================================
# 心屿 XinYu · Docker Compose 一键部署 (Python 单体后端版)
#
# 启动: docker compose up -d      访问: http://localhost
# 敏感配置在同目录 .env (不入库), 模板见 .env.example
#
# 拓扑 (架构重构后, Java 服务与独立 AI 服务已移除):
#   浏览器 -> nginx(80) -> 静态资源 / -> backend(9000, FastAPI 单体)
#                                    ├──────> mysql(3306)
#                                    └──────> qdrant(6333)
# backend/mysql/qdrant 只在 compose 内网暴露, 唯一对外入口是 nginx
# ============================================================

services:

  mysql:
    image: mysql:8.0
    container_name: xinyu-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: xinyu
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - xinyu-mysql-data:/var/lib/mysql
      # 单一来源: scripts/schema.sql (结构) + seed-core.sql (官方角色屿屿)
      # seed-dev.sql 仅本地开发用, 不挂载进容器
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./scripts/seed-core.sql:/docker-entrypoint-initdb.d/02-seed-core.sql:ro
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: xinyu-qdrant
    environment:
      TZ: Asia/Shanghai
    volumes:
      - xinyu-qdrant-data:/qdrant/storage
    expose:
      - "6333"   # REST API (Python SDK 走此端口)
      - "6334"   # gRPC API
    healthcheck:
      # qdrant 官方镜像 (debian-slim) 不带 wget/curl, 用 bash 内置 /dev/tcp 探测
      # (若失败镜像永远 unhealthy, depends_on 会卡死整个栈, 故不依赖额外二进制)
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Python 单体后端: 用户/认证/角色/会话/消息/统计/Memory/RAG/LLM 编排
  backend:
    build: ./xinyu-backend
    container_name: xinyu-backend
    environment:
      XINYU_ENV: prod
      XINYU_DB_HOST: mysql
      XINYU_DB_PORT: "3306"
      XINYU_DB_USER: root
      XINYU_DB_PASSWORD: ${MYSQL_PASSWORD}
      XINYU_DB_NAME: xinyu
      XINYU_JWT_SECRET: ${XINYU_JWT_SECRET}
      # 用户 API Key 加密密钥 (可选): 留空则回退 XINYU_JWT_SECRET; 存量库勿随意变更
      XINYU_CRYPTO_SECRET: ${XINYU_CRYPTO_SECRET:-}
      # Python SDK 走 Qdrant REST 端口 6333
      XINYU_QDRANT_URL: http://qdrant:6333
      XINYU_QDRANT_COLLECTION: xinyu_kb
      # Embedding 模型可选覆盖: 留空 = 按默认模型的服务商自动映射 (模型名+维度)
      XINYU_EMBEDDING_MODEL: ${XINYU_EMBEDDING_MODEL:-}
      XINYU_EMBEDDING_DIM: ${XINYU_EMBEDDING_DIM:-}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    expose:
      - "9000"
    healthcheck:
      # python:3.12-slim 没有 wget/curl, 用 Python 自带的 urllib 探测
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  nginx:
    build: ./xinyu-web
    container_name: xinyu-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  xinyu-mysql-data:
  xinyu-qdrant-data:
