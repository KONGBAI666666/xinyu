# ruff 配置 — 后端 lint + 格式化 (与项目风格对齐: 宽松起步, 拦真问题不拦风格偏好)
target-version = "py312"
line-length = 110
extend-exclude = ["migrations", ".venv"]

[lint]
select = [
    "E",   # pycodestyle 错误
    "W",   # pycodestyle 警告
    "F",   # pyflakes (未用导入/变量, 未定义名等真 bug)
    "I",   # isort 导入排序
    "B",   # bugbear (常见陷阱)
    "UP",  # pyupgrade (过时写法)
]
ignore = [
    "E501",  # 行超长由 formatter 管理, 中文注释/长 URL 不强行折行
    "B008",  # FastAPI 的 Depends()/Query() 参数默认值是框架惯例
]

[lint.isort]
known-first-party = ["app"]

[format]
# 与现有代码一致: 双引号 (项目现状)
quote-style = "double"
