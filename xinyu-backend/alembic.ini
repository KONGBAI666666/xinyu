# XinYu Alembic config (connection comes from app.core.config via env.py)
#
# Conventions:
# - Fresh database:      alembic upgrade head
# - Existing database    alembic stamp head   (then apply future migrations with
#   built by schema.sql: alembic upgrade head)
# - scripts/schema.sql stays the docker first-boot bootstrap and must be kept
#   in sync with migrations; schema changes go through alembic revisions only.
# - Legacy tables `tag` / `character_tag` have no ORM models and are not
#   managed by alembic.

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
