# ============================================================
# 心屿 Nginx 配置 (M1-7): 唯一对外入口 (宿主机 80)
#   /      Vue3 静态资源 (SPA 路由 fallback 到 index.html)
#   /api   反向代理到 backend:9000 (路径前缀原样保留, 与 vite 代理行为一致)
# SSE 关键配置: 关闭代理缓冲 + 长读超时, 否则流式回复会被 nginx 攒批/掐断
# ============================================================

server {
    listen 80;
    server_name localhost;

    # 知识库文档上传上限 (与 backend multipart max-file-size 一致, 超限返回 413)
    client_max_body_size 20m;

    # ---- 安全响应头 ----
    # nginx 规则: 子 location 出现任何 add_header 就不再继承本层, 需在 /assets/ 内重复声明
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # style 允许 unsafe-inline: Vue 内联样式与 markdown 渲染依赖 style 属性
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # ---- gzip ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # text/html 默认压缩, 无需列出
    gzip_types application/javascript application/json text/css image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源带 hash 指纹, 可长缓存; index.html 不缓存保证发版即生效
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # 本 location 有自己的 add_header, 安全头必须在此重复声明
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }

    location / {
        # SPA 前端路由: 刷新 /chat/xxx 等路径时兜底返回 index.html
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ---- SSE 流式必需 ----
        # 关闭缓冲: delta 事件逐条透传, 不在 nginx 层攒批
        proxy_buffering off;
        proxy_cache off;
        # HTTP/1.1 长连接 (清空 Connection 头, 避免向上游传 close)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # 后端 SSE 超时 180s, 代理读超时给足余量
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
