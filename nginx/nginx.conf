# ============================================================
# 心屿 Nginx 配置 (M1-7): 唯一对外入口 (宿主机 80)
#   /      Vue3 静态资源 (SPA 路由 fallback 到 index.html)
#   /api   反向代理到 backend:9000 (路径前缀原样保留, 与 vite 代理行为一致)
# SSE 关键配置: 关闭代理缓冲 + 长读超时, 否则流式回复会被 nginx 攒批/掐断
# ============================================================

server {
    listen 80;
    server_name localhost;

    # 知识库文档上传上限 (与 backend multipart max-file-size 一致, 超限返回 413)
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源带 hash 指纹, 可长缓存; index.html 不缓存保证发版即生效
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        # SPA 前端路由: 刷新 /chat/xxx 等路径时兜底返回 index.html
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ---- SSE 流式必需 ----
        # 关闭缓冲: delta 事件逐条透传, 不在 nginx 层攒批
        proxy_buffering off;
        proxy_cache off;
        # HTTP/1.1 长连接 (清空 Connection 头, 避免向上游传 close)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # 后端 SSE 超时 180s, 代理读超时给足余量
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
