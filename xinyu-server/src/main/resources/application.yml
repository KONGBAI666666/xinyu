# ============================================================
# 心屿 XinYu · 公共配置 (所有环境共享, 不含任何敏感信息)
# 环境差异配置见 application-dev.yml (本地, 不入库) / application-prod.yml (部署阶段创建)
# ============================================================

spring:
  application:
    name: xinyu-server
  profiles:
    active: dev
  jackson:
    # 统一时间格式与时区, 避免前后端时间对不上
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

server:
  # 8080 被本机其他项目占用, 固定使用 9000
  port: 9000

mybatis-plus:
  configuration:
    # 数据库下划线字段 <-> Java驼峰属性自动映射
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      # 主键统一使用雪花ID (对应设计文档 2.1 全局约定)
      id-type: assign_id
      # 逻辑删除统一字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.xinyu: debug

# 项目自定义配置 (非敏感部分; secret 在 application-dev/prod.yml, api-key 走环境变量)
xinyu:
  jwt:
    # access_token 有效期: 2小时 (对应 API 设计 3.1)
    expire-ms: 7200000
  ai-service:
    # Python AI 服务地址 (dev: localhost, Docker: 环境变量覆盖)
    base-url: ${XINYU_AI_SERVICE_BASE_URL:http://localhost:9100}
    connect-timeout-sec: 10
    read-timeout-sec: 180
  llm:
    # 计费单价（元 / 1K tokens）, 取通义千问 qwen-plus 公开价; 切换模型同步调整
    input-price-per-1k: 0.0008
    output-price-per-1k: 0.002
