# ============================================================
# 本地开发环境配置模板
# 使用方法: 复制本文件为 application-dev.yml, 填入真实值
# application-dev.yml 已加入 .gitignore, 绝不提交到仓库
# ============================================================

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # characterEncoding 取 Java 字符集名 utf8 (驱动会映射到 MySQL 的 utf8mb4), 不能写 utf8mb4
    url: jdbc:mysql://localhost:3306/xinyu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 填入你的MySQL密码

# 大模型配置 (M1-3 接入时使用; API Key只放这里, 不入库不提交)
xinyu:
  llm:
    api-key: 填入你的DashScope API Key
  jwt:
    # HS256 要求密钥至少 256 bit (32 个 ASCII 字符), 请换成自己的随机字符串
    secret: CHANGE_ME_TO_RANDOM_STRING_AT_LEAST_32_CHARS
