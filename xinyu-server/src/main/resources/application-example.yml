# ============================================================
# 本地环境配置模板
# 使用方法:
#   开发(Mock模型): 复制本文件为 application-dev.yml, 填入数据库密码
#   真实模型验收:   复制为 application-prod.yml, 并设置环境变量 DASHSCOPE_API_KEY
# 两个文件均已加入 .gitignore, 绝不提交到仓库
# ============================================================

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # characterEncoding 取 Java 字符集名 utf8 (驱动会映射到 MySQL 的 utf8mb4), 不能写 utf8mb4
    url: jdbc:mysql://localhost:3306/xinyu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 填入你的MySQL密码

# 大模型公共配置(base-url/model/超时)在 application.yml;
# API Key 只从环境变量 DASHSCOPE_API_KEY 注入: setx DASHSCOPE_API_KEY "sk-xxx" 后重启终端
xinyu:
  jwt:
    # HS256 要求密钥至少 256 bit (32 个 ASCII 字符), 请换成自己的随机字符串
    secret: CHANGE_ME_TO_RANDOM_STRING_AT_LEAST_32_CHARS
