# 心屿 CI: 后端单测 + 前端测试/类型检查/构建
#
# 后端 52 个单测均为纯函数测试 (分块器/限流器/雪花ID/安全兼容/URL 防护/上下文组装),
# 不依赖 MySQL/Qdrant, 无需 service 容器。
# 前端 vitest 同理; typecheck + build 保证契约类型与产物可构建。

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xinyu-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: xinyu-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check .
          ruff format --check .

      - name: Dump OpenAPI contract
        run: python scripts/dump_openapi.py

      - name: Contract drift check (openapi.json 与代码同步)
        run: git diff --exit-code -- xinyu-web/openapi.json

  frontend:
    name: Frontend tests / typecheck / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xinyu-web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: xinyu-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (vitest)
        run: npm run test

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (vue-tsc)
        run: npm run typecheck

      - name: Contract freshness (codegen diff)
        run: npm run codegen:check

      - name: Build (vite)
        run: npm run build
